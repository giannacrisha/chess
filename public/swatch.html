<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>gichess — piece swatch</title>
<link rel="stylesheet" href="/css/gichess.css">
<style>
  body { display:block; padding:24px; }
  .row { display:flex; gap:2px; margin-bottom:14px; align-items:flex-end; }
  .cell { display:grid; place-items:center; }
  .big  { width:150px; height:150px; }
  .small{ width:34px; height:34px; }
  .lt { background: var(--square-light); }
  .dk { background: var(--square-dark); }
  h2 { font-family: var(--font-serif); color: var(--color-heading); font-size:1rem; margin:18px 0 6px; }
</style>
</head>
<body>
<h1 class="wordmark">gichess</h1>
<div id="out"></div>
<script type="module">
import { installPieceDefs, pieceSVG } from '/js/pieces.js';
import { PAWN, KNIGHT, BISHOP, ROOK, QUEEN, KING } from '/js/rules.js';
installPieceDefs();
const types = [KING, QUEEN, ROOK, BISHOP, KNIGHT, PAWN];
const out = document.getElementById('out');
let html = '';
for (const [label, size] of [['96px, alternating squares','big'], ['34px','small']]) {
  html += `<h2>${label}</h2>`;
  for (const colour of ['w','b']) {
    html += '<div class="row">';
    types.forEach((t,i) => {
      html += `<div class="cell ${size} ${i%2?'dk':'lt'}">${pieceSVG(t,colour)}</div>`;
    });
    types.forEach((t,i) => {
      html += `<div class="cell ${size} ${i%2?'lt':'dk'}">${pieceSVG(t,colour)}</div>`;
    });
    html += '</div>';
  }
}
out.innerHTML = html;
</script>
</body></html>
